{% extends "base.html" %}
{% block title %}Quick Inspect Contract Form{% endblock %}
{% block content %}
<div class="container-fluid" style="height: calc(100vh - 24px)">
    <div class="row" style="height: calc(100vh - 24px)">
        <div class="col-12 col-md-6" style="align-content: center; text-align: center">
            <a class="btn btn-primary" href="{{ url_for('static', filename=doc_name) }}" download>Download as Docx</a>
            <a class="btn btn-info" href="{{ url_for('static', filename=pdf_name) }}" download>Download as PDF</a>
        </div>
        <div class="col-12 col-md-6">
            <embed src="{{ url_for('static', filename=pdf_name) }}" type="text/pdf" width="100%" height="100%">
        </div>
    </div>
</div>

{% endblock %}
