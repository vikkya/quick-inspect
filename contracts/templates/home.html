{% extends "base.html" %}
{% block title %}Quick Inspect Dealers Details{% endblock %}
{% block content %}
    <h1>Dealers and thier id's</h1>
    <table class="table table-hover">
        <thead>
          <tr>
            <th scope="col" class="text-center">#</th>
            <th scope="col" class="">Dealer's name</th>
          </tr>
        </thead>
        <tbody>
            {% for i in data %}
          <tr>
            <th scope="row" class="text-center">{{ i['id'] }}</th>
            <td class="">{{ i['name'] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
{% endblock %}
